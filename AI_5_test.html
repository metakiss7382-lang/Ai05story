<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五格故事挑戰</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:white;
    font-family:"Microsoft JhengHei",sans-serif;
    padding:20px;
}

/* 標題 */

h1{
    text-align:center;
    margin-bottom:25px;
    font-size:34px;
}

/* 上方按鈕 */

.top-bar{
    display:flex;
    justify-content:center;
    gap:15px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

button{
    background:#ffb400;
    border:none;
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:0.2s;
}

button:hover{
    transform:scale(1.05);
}

/* 提示 */

.hint{
    text-align:center;
    color:#aaa;
    margin-bottom:25px;
    line-height:1.8;
}

/* 五格卡片區 */

.card-area{
    display:flex;
    justify-content:center;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:35px;
}

/* 單張卡 */

.card-wrapper{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
}

/* 卡片 */

.card{
    width:260px;
    height:146px;
    perspective:1000px;
    cursor:pointer;
}

/* 16:9 */

.card-inner{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.7s;
}

.card.flipped .card-inner{
    transform:rotateY(180deg);
}

/* 正反面 */

.card-front,
.card-back{
    position:absolute;
    width:100%;
    height:100%;
    border-radius:16px;
    overflow:hidden;
    backface-visibility:hidden;
}

/* 背面 */

.card-front{
    background:#2b2b2b;
    border:2px solid #555;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    color:#999;
}

/* 正面圖片 */

.card-back{
    transform:rotateY(180deg);
}

.card-back img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* 左右移動按鈕 */

.move-buttons{
    display:flex;
    gap:10px;
}

.move-buttons button{
    padding:8px 14px;
    font-size:14px;
}

/* 故事輸入 */

.story-area{
    max-width:1200px;
    margin:auto;
}

textarea{
    width:100%;
    height:220px;
    border:none;
    border-radius:18px;
    padding:20px;
    font-size:18px;
    resize:none;
    background:#222;
    color:white;
    border:2px solid #444;
}

/* 圖庫 */

.gallery{
    margin-top:45px;
}

.gallery h2{
    text-align:center;
    margin-bottom:20px;
}

.gallery-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
}

.gallery-grid img{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;
    border-radius:12px;
}

/* 手機版 */

@media(max-width:768px){

    .card{
        width:100%;
        max-width:320px;
        height:180px;
    }

}

</style>
</head>

<body>

<h1>🎬 五格故事挑戰</h1>

<div class="top-bar">
    <button onclick="drawCards()">🎲 隨機抽取五張</button>
</div>

<p class="hint">
點擊圖卡可以翻牌查看圖片<br>
使用 ⬅ ➡ 可自由調整故事順序
</p>

<!-- 五張圖卡 -->

<div class="card-area" id="cardArea"></div>

<!-- 故事輸入 -->

<div class="story-area">

    <textarea placeholder="請依照五張圖片寫下一個故事..."></textarea>

</div>

<!-- 全部圖庫 -->

<div class="gallery">

    <h2>📚 全部圖庫</h2>

    <div class="gallery-grid" id="galleryGrid"></div>

</div>

<script>

/* =========================
   圖片庫
========================= */

const imageLibrary = [

    "images/1.jpg",
    "images/2.jpg",
    "images/3.jpg",
    "images/4.jpg",
    "images/5.jpg",
    "images/6.jpg",
    "images/7.jpg",
    "images/8.jpg",
    "images/9.jpg",
    "images/10.jpg"

];

/* =========================
   目前抽到的卡
========================= */

let currentCards = [];

/* =========================
   載入全部圖庫
========================= */

function loadGallery(){

    const gallery = document.getElementById("galleryGrid");


    gallery.innerHTML = "";

    imageLibrary.forEach(img=>{

        const image = document.createElement("img");

        image.src = img;

        gallery.appendChild(image);

    });

}

/* =========================
   隨機抽五張
========================= */

function drawCards(){

    const shuffled = [...imageLibrary]
    .sort(()=>Math.random()-0.5);

    currentCards = shuffled.slice(0,5);

    renderCards();

}

/* =========================
   顯示卡片
========================= */

function renderCards(){

    const area = document.getElementById("cardArea");

    area.innerHTML = "";

    currentCards.forEach((img,index)=>{

        const wrapper = document.createElement("div");

        wrapper.className = "card-wrapper";

        wrapper.innerHTML = `

        <div class="card" onclick="flipCard(this)">
        
            <div class="card-inner">

                <div class="card-front">
                    ?
                </div>

                <div class="card-back">
                    <img src="${img}">
                </div>

            </div>

        </div>

        <div class="move-buttons">

            <button onclick="moveLeft(${index})">
                ⬅
            </button>

            <button onclick="moveRight(${index})">
                ➡
            </button>

        </div>

        `;

        area.appendChild(wrapper);

    });

}

/* =========================
   翻牌
========================= */

function flipCard(card){

    card.classList.toggle("flipped");

}

/* =========================
   左移
========================= */

function moveLeft(index){

    if(index===0) return;

    [currentCards[index-1],currentCards[index]] =
    [currentCards[index],currentCards[index-1]];

    renderCards();

}

/* =========================
   右移
========================= */

function moveRight(index){

    if(index===currentCards.length-1) return;

    [currentCards[index+1],currentCards[index]] =
    [currentCards[index],currentCards[index+1]];

    renderCards();

}

/* =========================
   初始化
========================= */

loadGallery();

drawCards();

</script>

</body>
</html>
