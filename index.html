<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>故事抽卡挑戰</title>

  <!-- 連接 CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Microsoft JhengHei",sans-serif;
    }

    body{
      background:#0f172a;
      color:white;
      min-height:100vh;
      padding:30px;
    }

    h1{
      text-align:center;
      font-size:40px;
      margin-bottom:25px;
    }

    .top-bar{
      display:flex;
      justify-content:center;
      gap:15px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      padding:14px 24px;
      border-radius:12px;
      background:#2563eb;
      color:white;
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
    }

    button:hover{
      background:#1d4ed8;
      transform:translateY(-2px);
    }

    .tips{
      text-align:center;
      margin-bottom:20px;
      color:#94a3b8;
    }

    /* 卡片區 */
    .card-container{
      display:flex;
      gap:20px;
      justify-content:center;
      align-items:center;
      flex-wrap:nowrap;
      overflow-x:auto;
      padding:20px;
      margin-bottom:35px;
    }

    .card{
      width:240px;
      height:140px;
      min-width:240px;
      perspective:1000px;
      cursor:grab;
      user-select:none;
    }

    .card:active{
      cursor:grabbing;
    }

    .card-inner{
      position:relative;
      width:100%;
      height:100%;
      transition:transform 0.7s;
      transform-style:preserve-3d;
    }

    .card.flipped .card-inner{
      transform:rotateY(180deg);
    }

    .card-front,
    .card-back{
      position:absolute;
      width:100%;
      height:100%;
      border-radius:18px;
      overflow:hidden;
      backface-visibility:hidden;
    }

    .card-front{
      background:#1e293b;
      border:2px solid #334155;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:24px;
      font-weight:bold;
    }

    .card-back{
      transform:rotateY(180deg);
    }

    .card-back img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    /* 故事輸入 */
    .story-section{
      max-width:1200px;
      margin:auto;
    }

    textarea{
      width:100%;
      height:220px;
      border:none;
      border-radius:18px;
      padding:20px;
      font-size:18px;
      resize:none;
      outline:none;
      background:white;
      color:#111827;
    }

    /* 圖庫 */
    .gallery{
      margin-top:45px;
      display:none;
    }

    .gallery h2{
      text-align:center;
      margin-bottom:20px;
    }

    .gallery-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:18px;
    }

    .gallery-grid img{
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:15px;
    }

  </style>
</head>

<body>

  <h1>🎬 故事抽卡挑戰</h1>

  <div class="top-bar">
    <button onclick="drawCards()">🎲 隨機抽取圖片</button>
    <button onclick="toggleGallery()">🖼 查看全部圖庫</button>
  </div>

  <p class="tips">
    點擊卡片翻面查看圖片，拖曳卡片可自由左右調整順序。
  </p>

  <!-- 卡片區 -->
  <div class="card-container" id="cardContainer"></div>

  <!-- 故事輸入 -->
  <div class="story-section">
    <textarea placeholder="請依照圖片順序，創作一段完整故事..."></textarea>
  </div>

  <!-- 圖庫 -->
  <div class="gallery" id="gallery">

    <h2>全部圖片庫</h2>

    <div class="gallery-grid" id="galleryGrid"></div>

  </div>

  <!-- 連接 JS -->
  <script src="script.js"></script>

  <script>

    // ========================
    // 圖片庫
    // ========================

    const imageLibrary = [

      "https://picsum.photos/id/1015/600/400",
      "https://picsum.photos/id/1025/600/400",
      "https://picsum.photos/id/1035/600/400",
      "https://picsum.photos/id/1043/600/400",
      "https://picsum.photos/id/1050/600/400",
      "https://picsum.photos/id/1060/600/400",
      "https://picsum.photos/id/1074/600/400",
      "https://picsum.photos/id/1084/600/400",
      "https://picsum.photos/id/1080/600/400",
      "https://picsum.photos/id/1070/600/400"

    ];

    const container = document.getElementById("cardContainer");
    const galleryGrid = document.getElementById("galleryGrid");

    // ========================
    // 建立圖庫
    // ========================

    imageLibrary.forEach(img => {

      const image = document.createElement("img");

      image.src = img;

      galleryGrid.appendChild(image);

    });

    // ========================
    // 隨機抽卡
    // ========================

    function drawCards(){

      container.innerHTML = "";

      const shuffled = [...imageLibrary]
        .sort(() => 0.5 - Math.random())
        .slice(0,5);

      shuffled.forEach((img)=>{

        const card = document.createElement("div");

        card.className = "card";

        card.draggable = true;

        card.innerHTML = `

          <div class="card-inner">

            <div class="card-front">
              ❓ 點擊翻轉
            </div>

            <div class="card-back">
              <img src="${img}">
            </div>

          </div>

        `;

        // 點擊翻轉
        card.addEventListener("click",()=>{

          card.classList.toggle("flipped");

        });

        // 拖曳排序
        card.addEventListener("dragstart", dragStart);

        card.addEventListener("dragend", dragEnd);

        card.addEventListener("dragover", dragOver);

        card.addEventListener("drop", drop);

        container.appendChild(card);

      });

    }

    // ========================
    // 顯示圖庫
    // ========================

    function toggleGallery(){

      const gallery = document.getElementById("gallery");

      if(gallery.style.display === "block"){

        gallery.style.display = "none";

      }else{

        gallery.style.display = "block";

      }

    }

    // ========================
    // 卡片拖曳排序
    // ========================

    let draggedItem = null;

    // 開始拖曳
    function dragStart(){

      draggedItem = this;

      setTimeout(()=>{

        this.style.opacity = "0.3";

      },0);

    }

    // 拖曳結束
    function dragEnd(){

      this.style.opacity = "1";

    }

    // 拖曳經過
    function dragOver(e){

      e.preventDefault();

    }

    // 放下
    function drop(e){

      e.preventDefault();

      if(draggedItem !== this){

        const cards = [...container.querySelectorAll(".card")];

        const draggedIndex = cards.indexOf(draggedItem);

        const targetIndex = cards.indexOf(this);

        if(draggedIndex < targetIndex){

          container.insertBefore(draggedItem, this.nextSibling);

        }else{

          container.insertBefore(draggedItem, this);

        }

      }

    }

    // ========================
    // 預設載入
    // ========================

    drawCards();

  </script>

</body>

</html>
